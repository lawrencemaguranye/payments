[project]
name = "postilion-agent"
version = "0.1.0"
description = "AI troubleshooting agent for Postilion payment-switch environments"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-pptx>=1.0",
    "typer>=0.12",
    "pydantic-settings>=2.4",
]

[project.scripts]
payments = "postilion_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postilion_agent"]
